services:
  genpod-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lighttts-api
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=${PORT:-8000}
      - DEVICE=${DEVICE:-cpu}
      - MODELS_PATH=/app/data/models
      - VOICES_PATH=/app/data/voices
      - TRITON_CACHE_DIR=/tmp/.triton
    volumes:
      - ./data/models:/app/data/models
      - ./data/voices:/app/data/voices
    env_file:
      - .env
    restart: unless-stopped
